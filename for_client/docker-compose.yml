
services:
  web:
    image: achuuuu/psusphere-docker:latest

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    ports:
      - "8000:8000"

    volumes:
      - django_data:/app/data

    environment:
      DEBUG: "1"
      USE_SQLITE: "true"
      SQLITE_DB_PATH: "/app/data/db.sqlite3"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1"

volumes:
  django_data:
